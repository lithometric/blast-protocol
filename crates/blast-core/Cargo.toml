[package]
name = "blast-core"
version = "0.1.0"
edition = "2021"
description = "Parse and graph engine for the Blast protocol: symbols and call edges, ten languages, no runtime dependencies"
license = "MIT"

[dependencies]
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-php = "0.23"
